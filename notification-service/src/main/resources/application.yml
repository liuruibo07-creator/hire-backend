server:
  port: 8084

# 配置微服务与Sentinel控制台的连接
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${cloud.datasource.host}:${cloud.datasource.port}/${cloud.datasource.dbname}?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${cloud.datasource.username}
    password: ${cloud.datasource.password}
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}   #指定控制台地址
        port: 8719  #指定客户端端口
      eager: true  #默认值为false,表示懒加载,设置为true,Sentinel会在应用启动时立即初始化
      http-method-specify: true  #开启之后,资源名称中将包含请求方式,用来区分Restful风格接口
  rabbitmq:
    host: ${INFRA_HOST:localhost}
    port: 5672
    virtual-host: ${RABBITMQ_VHOST:hire}
    username: ${RABBITMQ_USER:hire}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # 自动 ACK：方法正常返回即确认
        acknowledge-mode: auto
        # 重试耗尽后兜底：不重回原队列，交给 MessageRecoverer 处理
        default-requeue-rejected: false
        # 一次只投递一条，处理完再推下一条，避免瞬时大批量消息压垮消费端
        prefetch: 1
        # 客户端本地重试：失败后在应用内重试，全部耗尽才交给 RepublishMessageRecoverer
        # 发布到错误交换机。不开启 retry 的话 MessageRecoverer 不会被触发
        retry:
          enabled: true # 开启消费者失败重试
          initial-interval: 1000ms # 初始的失败等待时长为1秒
          multiplier: 1 # 下次失败的等待时长倍数，下次等待时长 = multiplier * last-interval
          max-attempts: 3 # 最大重试次数
  # Redis：未读通知数计数与缓存（docker 部署见环境搭建文档第9节）
  redis:
    host: ${INFRA_HOST:localhost}
    port: 6379
    password: ${REDIS_PASSWORD}
    timeout: 3s
#微服务自定义配置
cloud:
  datasource:
    host: ${INFRA_HOST:localhost}
    port: 3306
    dbname: cloud_notification
    username: ${DB_USER:root}
    password: ${MYSQL_ROOT_PASSWORD}

#让Sentinel能识别feign接口为资源
feign:
  sentinel:
    enabled: true

seata:
  data-source-proxy-mode: AT

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
